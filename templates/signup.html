{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | SmartTravel</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body class="auth-page">

<div class="auth-card">
    <a href="{% url 'home' %}" class="logo">SmartTravel<span>.</span></a>

    <h1>Create Account</h1>
    <p class="auth-subtitle">Start planning your next journey.</p>

    {% if messages %}
        {% for message in messages %}
            <div class="message {{ message.tags }}">{{ message }}</div>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <label>Full Name</label>
        <input type="text" name="name" placeholder="Enter your full name" required>

        <label>Username</label>
        <input type="text" name="username" placeholder="Choose a username" required>

        <label>Email Address</label>
        <input type="email" name="email" placeholder="Enter your email" required>

        <label>Password</label>
        <input type="password" name="password" minlength="8"
               placeholder="At least 8 characters" required>

        <label>Confirm Password</label>
        <input type="password" name="confirm_password" minlength="8"
               placeholder="Re-enter your password" required>

        <button type="submit" class="btn primary-btn full-btn">
            Create Account
        </button>
    </form>

    <p class="auth-footer">
        Already have an account?
        <a href="{% url 'login' %}">Login</a>
    </p>
</div>

</body>
</html>
